name: postal-data-refresh

on:
  schedule:
    - cron: "21 9 * * 4"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run postal:refresh
      - run: npm run postal:verify
      - name: Publish the postal update for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/review_postal_update.sh
